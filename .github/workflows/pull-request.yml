name: Pull Request

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  workflow-lint:
    uses: mindee/client-lib-actions/.github/workflows/workflow-lint.yml@main
  betterleaks:
    uses: mindee/client-lib-actions/.github/workflows/betterleaks.yml@main
    needs: workflow-lint
    secrets: inherit
  static-analysis:
    uses: ./.github/workflows/_static-analysis.yml
    needs: workflow-lint
  test-units:
    uses: ./.github/workflows/_test-units.yml
    needs: [ betterleaks, static-analysis ]
    secrets: inherit
  test-smoke:
    uses: ./.github/workflows/_test-smoke.yml
    needs: [ betterleaks, static-analysis ]
    secrets: inherit
  test-integrations:
    uses: ./.github/workflows/_test-integrations.yml
    needs: test-units
    secrets: inherit
