name: Publish Release

on:
  release:
    types: [ published ]

jobs:
  publish_docs:
    uses: ./.github/workflows/_publish-docs.yml
    secrets: inherit
  publish_guide:
    uses: ./.github/workflows/_publish-guide.yml
    needs: publish_docs
    secrets: inherit
  publish_code:
    uses: ./.github/workflows/_publish-code.yml
    secrets: inherit
